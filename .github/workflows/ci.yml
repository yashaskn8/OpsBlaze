name: OpsBlaze CI and release evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: opsblaze-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflow-policy:
    name: Workflow and repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.9 -color
      - name: Verify migration graph and tracked secrets
        run: |
          python -m pip install "alembic>=1.14,<2" "sqlalchemy>=2,<3"
          python scripts/check_migrations.py
          python scripts/check_secrets.py
      - name: Enforce native Linux service role isolation and hardening
        run: python scripts/check_native_services.py

  python-quality:
    name: Python quality, unit tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]" "pytest-cov>=6,<8"
      - name: Compile Python
        run: python -m compileall -q backend migrations tests scripts
      - name: Ruff correctness
        run: ruff check backend tests scripts migrations --select F --output-format github
      - name: Unit and API tests with coverage gate
        run: |
          mkdir -p ci-artifacts
          python -m pytest -q --cov=backend --cov-branch --cov-report=term-missing --cov-report=xml:ci-artifacts/coverage.xml --cov-fail-under=75
      - name: Synthetic local capacity report
        run: python -m backend.benchmarks.local_capacity --output ci-artifacts/local-capacity.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-test-evidence
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

  security-negative:
    name: Security regression and adversarial tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]" "bandit>=1.8,<2"
      - name: Static Python security scan
        run: bandit -r backend -ll -ii -q
      - name: Adversarial regression tests
        run: python -m pytest -q -o addopts= -m "not integration" -k redteam

  dependency-audit:
    name: Python and npm vulnerability gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit Python dependencies
        run: |
          python -m pip install "pip-audit>=2.9,<3"
          python -m pip_audit . --strict
          python -m pip_audit --require-hashes --disable-pip --strict -r requirements-build.lock -r requirements-runtime.lock
      - name: Audit entire npm tree
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

  frontend:
    name: React TypeScript production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Read-only frontend API contract tests
        run: node --experimental-strip-types --test tests/api.test.mjs tests/lineagePages.test.mjs
      - name: Strict TypeScript check and Vite build
        run: npm run build
      - name: Validate bundle output
        run: |
          test -s dist/index.html
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 14

  temporal-smoke:
    name: Native Temporal workflow and replay tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Native integration and synthetic history replay
        env:
          OPSBLAZE_SYNTHETIC_REPLAY_ARCHIVE: ${{ runner.temp }}/opsblaze-synthetic-replay
        run: python -m pytest -q -o addopts= -m "integration and not pg_e2e"
      - name: Check out pinned synthetic replay baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 17aae2fc5500b2f95107231edae946d91b4e89e8
          path: replay-baseline
          persist-credentials: false
      - name: Generate native histories from the pinned source revision
        working-directory: replay-baseline
        env:
          OPSBLAZE_SYNTHETIC_REPLAY_ARCHIVE: ${{ runner.temp }}/opsblaze-prior-replay
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "17aae2fc5500b2f95107231edae946d91b4e89e8"
          GITHUB_SHA=17aae2fc5500b2f95107231edae946d91b4e89e8 python -m pytest -q -o addopts= -m integration tests/test_temporal_history_replay.py
      - name: Resume active baseline workflows on the candidate worker
        env:
          OPSBLAZE_RESTART_BASELINE: ${{ github.workspace }}/replay-baseline
        run: python -m pytest -q -o addopts= -m integration tests/test_temporal_worker_restart.py
      - name: Replay pinned-source histories against the candidate
        env:
          PRIOR_REPLAY_ARCHIVE: ${{ runner.temp }}/opsblaze-prior-replay
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" != "17aae2fc5500b2f95107231edae946d91b4e89e8"
          python -m backend.workflows.replay_archive "$PRIOR_REPLAY_ARCHIVE" --source-commit 17aae2fc5500b2f95107231edae946d91b4e89e8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-replay-histories-${{ github.sha }}
          path: ${{ runner.temp }}/opsblaze-synthetic-replay/
          if-no-files-found: error
          retention-days: 30

  postgres-temporal-e2e:
    name: PostgreSQL migrations, isolation and Temporal E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPSBLAZE_DATABASE_URL: postgresql+asyncpg://opsblaze:opsblaze@127.0.0.1:5432/opsblaze
      OPSBLAZE_LOCAL_TOKEN: ci-local-token
      OPSBLAZE_REVIEW_TOKEN: ci-separate-reviewer-token
      OPSBLAZE_ENVIRONMENT: development
      OPSBLAZE_PROJECTOR_DATABASE_URL: postgresql+asyncpg://opsblaze_projector:ci-only-projector@127.0.0.1:5432/opsblaze
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install native PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo service postgresql start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER opsblaze WITH PASSWORD 'opsblaze';"
          sudo -u postgres createdb -O opsblaze opsblaze
      - run: python -m pip install -e ".[dev]"
      - name: Validate migrations and detect schema drift
        run: |
          python scripts/check_migrations.py
          alembic upgrade head
          alembic check
      - name: Apply restricted projector grants
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE opsblaze_projector LOGIN NOINHERIT PASSWORD 'ci-only-projector';"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d opsblaze -f scripts/projector_grants.sql
      - name: Disposable adapter conformance
        run: python -m backend.adapters.conformance
      - name: Native PG and Temporal integration
        run: python -m pytest -q -o addopts= -m pg_e2e
      - name: Paired native PostgreSQL and Temporal restore rehearsal (simulator only)
        run: |
          set -euo pipefail
          restore_db="opsblaze_restore_$GITHUB_RUN_ID"
          sudo -u postgres createdb -O opsblaze "$restore_db"
          work="$(mktemp -d "$RUNNER_TEMP/opsblaze-paired-restore.XXXXXXXX")"
          trap 'sudo -u postgres dropdb --if-exists "$restore_db"; rm -rf -- "$work"' EXIT
          python scripts/pg_restore_smoke.py seed --manifest "$work/sentinel.json" --temporal-store "$work/source.db"
          cp "$work/source.db" "$work/restore.db"
          PGPASSWORD=opsblaze pg_dump -h 127.0.0.1 -U opsblaze -d opsblaze -F c -f "$work/opsblaze.dump"
          PGPASSWORD=opsblaze pg_restore -h 127.0.0.1 -U opsblaze --no-owner --no-acl --exit-on-error -d "$restore_db" "$work/opsblaze.dump"
          # pg_restore --no-acl intentionally omits role grants. Reapply the
          # explicit scoped grants as a separate recovery step before verifying.
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$restore_db" -f scripts/projector_grants.sql
          export OPSBLAZE_DATABASE_URL="postgresql+asyncpg://opsblaze:opsblaze@127.0.0.1:5432/$restore_db"
          python scripts/pg_restore_smoke.py verify --manifest "$work/sentinel.json" \
            --temporal-store "$work/restore.db" --output ci-artifacts/pg-restore-evidence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-pg-restore-evidence
          path: ci-artifacts/pg-restore-evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify source-RLS rollback fails closed, then downgrade to base
        run: |
          set -euo pipefail
          alembic downgrade 0036_projector_outbox_rls
          # Preserve deny-by-default source RLS with the old service grants.
          for table in incident outcome_revision evidence experience_consent tenant_experience_consent experience_capsule; do
            count="$(PGPASSWORD=ci-only-projector psql -h 127.0.0.1 -U opsblaze_projector -d opsblaze -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM public.$table")"
            if [ "$count" != "0" ]; then
              echo "::error::Projector source access survived rollback: $table"
              exit 1
            fi
          done
          alembic downgrade base

  codeql:
    name: CodeQL ${{ matrix.language }} analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4

  release-candidate:
    name: Attested release candidate (NO deployment)
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    needs:
      - workflow-policy
      - python-quality
      - security-negative
      - dependency-audit
      - frontend
      - temporal-smoke
      - postgres-temporal-e2e
      - codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Python distribution and frontend
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build.lock
          python -m build --no-isolation --sdist --wheel --outdir dist
          python -m pip install --require-hashes --only-binary=:all: -r requirements-runtime.lock
          python -m pip install --no-deps dist/*.whl
          python -m pip check
          (cd frontend && npm ci --no-audit --no-fund && npm run build)
      - name: Package Community Edition candidate with digest manifest
        run: |
          mkdir -p release/staging/frontend release/staging/python release/staging/docs/engineering release/staging/docs/runbooks
          cp -a frontend/dist release/staging/frontend/
          cp -a dist/. release/staging/python/
          cp -a migrations deploy scripts alembic.ini release/staging/
          cp README.md SECURITY.md CONSTRAINTS.md pyproject.toml requirements-build.lock requirements-runtime.lock .env.example release/staging/
          cp frontend/package.json frontend/package-lock.json release/staging/frontend/
          cp docs/requirements-ledger.json docs/requirements-audit.json docs/requirements-omega.json docs/production-acceptance-gates.md release/staging/docs/
          cp docs/architecture-improvement-plan.md docs/implementation-status.md release/staging/docs/
          cp docs/engineering/*.md release/staging/docs/engineering/
          cp docs/runbooks/operational-gates.md release/staging/docs/runbooks/
          cp docs/production-acceptance-gates.md release/staging/PRODUCTION_GATES_BLOCKED.md
          python -m backend.release_profile "$GITHUB_SHA" > release/staging/RELEASE_PROFILE.json
          python scripts/release_requirements.py --source-commit "$GITHUB_SHA" > release/staging/REQUIREMENT_ACCEPTANCE.json
          printf '%s\n' "$GITHUB_SHA" > release/staging/SOURCE_COMMIT
          tar -C release/staging -czf "release/opsblaze-${GITHUB_SHA}.tar.gz" .
          (cd release && sha256sum "opsblaze-${GITHUB_SHA}.tar.gz" > SHA256SUMS)
          python scripts/release_requirements.py --decision --source-commit "$GITHUB_SHA" \
            --artifact "release/opsblaze-${GITHUB_SHA}.tar.gz" > release/RELEASE_DECISION.json
          rm -rf release/staging
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/opsblaze-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opsblaze-verified-release-candidate
          path: |
            release/*.tar.gz
            release/SHA256SUMS
            release/RELEASE_DECISION.json
          if-no-files-found: error
          retention-days: 30
