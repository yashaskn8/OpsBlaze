name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio httpx pydantic sqlalchemy alembic

      - name: Lint with Ruff
        run: |
          ruff check backend/ tests/

      - name: Typecheck with Mypy
        run: |
          mypy backend/domain/release.py backend/releases/ backend/api/releases.py

      - name: Run Schema and Architecture Tests
        run: |
          pytest tests/unit/test_no_unauthorized_html.py tests/unit/test_e6_bundle_integrity.py tests/unit/test_e6_canary_assignment.py -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
