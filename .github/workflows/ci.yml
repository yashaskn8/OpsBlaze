name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    name: Backend Quality & Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: opsblaze
          POSTGRES_PASSWORD: opsblaze_dev_password
          POSTGRES_DB: opsblaze_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPSBLAZE_ENV: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opsblaze
      POSTGRES_PASSWORD: opsblaze_dev_password
      POSTGRES_DB: opsblaze_test
      AUTH_SECRET_KEY: opsblaze-dev-auth-secret-key-32bytes-hex-safe
      POLICY_SIGNING_SECRET: opsblaze-dev-policy-signing-secret-hex-safe
      POLICY_SIGNING_KEY_ID: key-1
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Apply PostgreSQL migrations
        run: uv run alembic upgrade head

      - name: Lint with Ruff
        run: uv run ruff check backend tests

      - name: Typecheck with Mypy
        run: uv run mypy backend

      - name: Run the complete repository test suite
        run: uv run pytest -q -m "not historical"

  frontend-quality:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck Frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build Frontend (Vite)
        working-directory: frontend
        run: npm run build
