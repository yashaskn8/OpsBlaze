name: Backend checks
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q backend migrations tests
      - run: ruff check backend tests --select F821,F822,F823
      # Flag unused imports and assigned-but-never-used values in shipped code.
      - run: ruff check backend tests --select F401,F841
      - run: python -m pytest -q
      # CI-only in-process profile, not a production throughput claim.
      - run: python -m backend.benchmarks.local_capacity --output ci-artifacts/local-capacity.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-local-capacity
          path: ci-artifacts/local-capacity.json
          retention-days: 7

  security-negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      # The same cases are also run by the full backend suite. This separate
      # result prevents the adversarial gates from being hidden in total counts.
      - run: python -m pytest -q -o addopts= -m "not integration" -k redteam

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  temporal-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -o addopts= -m "integration and not pg_e2e"

  postgres-temporal-e2e:
    runs-on: ubuntu-latest
    env:
      OPSBLAZE_DATABASE_URL: postgresql+asyncpg://opsblaze:opsblaze@127.0.0.1:5432/opsblaze
      OPSBLAZE_LOCAL_TOKEN: ci-local-token
      OPSBLAZE_REVIEW_TOKEN: ci-separate-reviewer-token
      OPSBLAZE_ENVIRONMENT: development
      OPSBLAZE_PROJECTOR_DATABASE_URL: postgresql+asyncpg://opsblaze_projector:ci-only-projector@127.0.0.1:5432/opsblaze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo service postgresql start
          sudo -u postgres psql -c "CREATE USER opsblaze WITH PASSWORD 'opsblaze';"
          sudo -u postgres createdb -O opsblaze opsblaze
      - run: python -m pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: |
          sudo -u postgres psql -c "CREATE ROLE opsblaze_projector LOGIN NOINHERIT PASSWORD 'ci-only-projector';"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d opsblaze -f scripts/projector_grants.sql
      - run: python -m backend.adapters.conformance
      - run: python -m pytest -q -o addopts= -m pg_e2e
      - run: alembic downgrade base
