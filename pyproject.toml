[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opsblaze"
version = "0.1.0"
description = "Controlled incident investigation and recovery lab"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "temporalio>=1.11,<2",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "PyJWT[crypto]>=2.13,<3",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.30,<2",
]

[project.optional-dependencies]
ai = ["openai>=2,<3"]
observability = [
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
dev = [
  "opentelemetry-sdk>=1.30,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "pytest-asyncio>=0.24,<2",
  "aiosqlite>=0.20,<1",
  "temporalio>=1.11,<2",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[dependency-groups]
release-build = ["build>=1.2,<2", "setuptools>=75"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires the native local Temporal test server",
    "pg_e2e: requires a native PostgreSQL instance and migrated schema",
]
addopts = "-m 'not integration'"
